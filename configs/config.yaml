
project:
  name: store-sales-forecasting
  random_state: 42

data:
  train_path: data/raw/train.csv
  test_path: data/raw/test.csv
  validation_start: "2017-07-31"

features:
  group_columns:
    - store_nbr
    - family
  horizon: 16
  lags:
    - 16
    - 21
    - 28
    - 364
  rolling_windows:
    - 7
    - 14
    - 28
  rolling_std_window: 14

model:
  name: lightgbm
  params:
    objective: regression
    n_estimators: 1500
    learning_rate: 0.05
    num_leaves: 31
    max_depth: -1
    n_jobs: -1
    verbose: -1

training:
  early_stopping_rounds: 50
  eval_metric: rmse

tracking:
  experiment_name: store-sales-experiments
  tracking_uri: sqlite:///mlflow.db
  log_model: true

backtesting:
  initial_train_end: "2016-06-30"
  validation_days: 16